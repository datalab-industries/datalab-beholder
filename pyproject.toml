[project]
name = "datalab-beholder"
version = "0.1.0"
description = "Filesystem watcher daemon for datalab instances"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10, <3.13"
dependencies = [
    "click ~= 8.3",
    "datalab-api",
    "pydantic ~= 2.12",
    "pyyaml ~= 6.0",
]

[project.scripts]
datalab-beholder = "datalab_beholder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datalab_beholder"]

[dependency-groups]
dev = [
    "pyinstaller ~= 6.19",
    "pytest ~= 9.0",
    "pre-commit ~= 4.5"
]

[tool.uv.sources]
datalab-api = { git = "https://github.com/datalab-org/datalab-api" }
