[project]
name = "datalab-beholder"
version = "0.1.0"
description = "Filesystem watcher daemon for datalab instances"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "datalab-api>=0.3.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "watchdog>=3.0",
]

[project.scripts]
datalab-beholder = "datalab_beholder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datalab_beholder"]

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
    "pytest>=7.0",
]
