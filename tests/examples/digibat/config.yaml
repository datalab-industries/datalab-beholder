datalabs:
- name: digibat
  url: https://example.com
  api_key: your-api-key-here
log_level: debug
sync:
  metadata_interval: 1200
watched_paths:
- name: digibat
  path: "."
  datalab: digibat
  item_type: cells
  item_id_template: "{group_id}/{item_id}"
  include_patterns:
    - "*.mpr"
  id_patterns:
    # P-code project dir, anything, then a digit run sandwiched between two
    # separators (`/`, `_`, `-`). Greedy `.*` lets the last sandwich win.
    - "^(?P<group_id>P[0-9]+).*[/_-](?P<item_id>[0-9]+)[_-]"
