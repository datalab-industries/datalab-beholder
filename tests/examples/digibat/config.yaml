datalabs:
- name: digibat
  url: https://example.com
  api_key: your-api-key-here
log_level: debug
sync:
  metadata_interval: 1200
watched_paths:
- name: digibat
  path: "."
  datalab: digibat
  item_type: cells
  item_id_template: "{group_id}/{item_id}"
  include_patterns:
    - "*.mpr"
  id_patterns:
    # P-code project dir, then any depth, then a basename whose *last* digit run
    # (before the .mpr extension) is the item id. `\D*\.mpr$` forces the regex
    # to backtrack onto the last digit group rather than the first.
    - "^(?P<group_id>P[0-9]{3,})/.*?(?P<item_id>\\d+)\\D*\\.mpr$"
